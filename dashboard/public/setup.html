<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYJ Deploy — Setup</title></head><body><main><h1>SYJ Deploy</h1><p>Initial administrator setup is required.</p><form id="f"><input id="u" placeholder="Admin username" required><input id="p" type="password" minlength="12" placeholder="Admin password (12+ characters)" required><button>Create administrator</button></form><pre id="m"></pre></main><script>f.onsubmit=async e=>{e.preventDefault();m.textContent='Creating…';const r=await fetch('/api/auth/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const j=await r.json();if(!r.ok)m.textContent=j.error||'Setup failed';else location='/'}</script><style>body{font:16px system-ui;background:#0b0a0f;color:#eee;display:grid;place-items:center;min-height:100vh}main{width:min(92vw,420px);padding:32px;background:#15131c;border:1px solid #292433;border-radius:18px}input,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box;border-radius:10px;border:1px solid #332d40;background:#0d0c11;color:#fff}button{background:#7c3aed;border:0}</style></body></html>
