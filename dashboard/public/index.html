<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><title>SYJ Deploy</title><style>body{margin:0;background:#0b0a0f;color:#eee;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px}header{padding:18px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #25212c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#131119;border:1px solid #282331;border-radius:16px;padding:18px}.btn{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.danger{background:#8b1e2d}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,textarea{width:100%;box-sizing:border-box;background:#0d0c11;color:#eee;border:1px solid #302a38;border-radius:9px;padding:10px;margin:5px 0}label{display:block}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center}.modal>div{background:#15131c;padding:22px;border-radius:18px;width:min(92vw,560px);max-height:90vh;overflow:auto}pre{background:#050507;padding:12px;border-radius:12px;overflow:auto;max-height:260px}.ok{color:#22c55e}.muted{color:#888}</style></head><body><header><strong>SYJ Deploy</strong><span id="who"></span><button class="btn" onclick="logout()">Sign out</button></header><main class="wrap"><section id="login"><h2>Sign in</h2><form onsubmit="login(event)"><label>Username<input id="lu" required></label><label>Password<input id="lp" type="password" required></label><button class="btn">Sign in</button></form></section><section id="dash" hidden><div class="row"><h2>Applications</h2><button class="btn" onclick="openDeploy()">Deploy app</button><button class="btn" id="users" hidden onclick="usersList()">Users</button></div><div id="apps" class="grid"></div><p class="muted">The process runner provides no isolation. Docker mode is preferred for untrusted workloads.</p></section></main><div id="modal" class="modal"><div><div class="row"><h2>Deploy app</h2><button class="btn danger" onclick="closeDeploy()">Close</button></div><form onsubmit="createAndDeploy(event)"><label>Name<input id="an" pattern="[a-z][a-z0-9-]{1,62}" required></label><label>Repository URL<input id="ar" placeholder="https://github.com/user/repo" required></label><label>Branch<input id="ab" value="main" required></label><label>Build command<input id="ac" placeholder="npm run build"></label><label>Start command<input id="as" value="npm start" required></label><label>Health path<input id="ah" value="/"></label><label>Environment<textarea id="ae" placeholder="KEY=value"></textarea></label><button class="btn">Queue deployment</button></form></div></div><script src="/socket.io/socket.io.js"></script><script>let csrf='',me=null;const $=x=>document.getElementById(x);async function getCsrf(){const r=await fetch('/api/csrf');const j=await r.json();if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);csrf=j.csrfToken;return csrf}async function api(u,o={}){o.headers=Object.assign({'content-type':'application/json','x-csrf-token':csrf},o.headers||{});const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}async function boot(){const s=await fetch('/api/setup/status').then(r=>r.json());if(s.setupRequired)return;await getCsrf();const r=await fetch('/api/auth/me');if(r.ok){const j=await r.json();me=j.user;csrf=j.csrfToken;show()}}function show(){$('login').hidden=true;$('dash').hidden=false;$('who').textContent=`${me.username} · ${me.role}`;$('users').hidden=me.role!=='admin';loadApps()}async function login(e){e.preventDefault();try{await getCsrf();await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})});const j=await fetch('/api/auth/me').then(r=>r.json());me=j.user;csrf=j.csrfToken;show()}catch(e){alert(e.message)}}async function logout(){await api('/api/auth/logout',{method:'POST'});location='/'}function openDeploy(){$('modal').style.display='flex'}function closeDeploy(){$('modal').style.display='none'}function env(){return $('ae').value.split(/\r?\n/).filter(Boolean)}async function createAndDeploy(e){e.preventDefault();try{const a=await api('/api/apps',{method:'POST',body:JSON.stringify({name:$('an').value,repoUrl:$('ar').value,branch:$('ab').value,buildCommand:$('ac').value,startCommand:$('as').value,healthPath:$('ah').value,env:env()})});await api('/api/deploy/'+a.id,{method:'POST'});closeDeploy();loadApps()}catch(e){alert(e.message)}}async function loadApps(){try{const j=await api('/api/apps');$('apps').innerHTML=j.map(a=>`<article class=card><h3>${a.name}</h3><p class=muted>${a.stack||'auto'} · ${a.status} · port ${a.port||'—'}</p><p>${a.status==='running'?'<span class=ok>● running</span>':'● '+a.status}</p><div class=row><button class=btn onclick="run('${a.id}')">Deploy</button><button class="btn danger" onclick="stop('${a.id}')">Stop</button><button class=btn onclick="info('${a.id}')">Details</button></div><pre id="l${a.id}">loading…</pre></article>`).join('');j.forEach(a=>loadLog(a.id))}catch(e){console.error(e)}}async function run(id){try{await api('/api/deploy/'+id,{method:'POST'});setTimeout(loadApps,1000)}catch(e){alert(e.message)}}async function stop(id){try{await api('/api/deploy/'+id+'/stop',{method:'POST'});loadApps()}catch(e){alert(e.message)}}async function loadLog(id){const r=await fetch('/api/logs/'+id);$('l'+id).textContent=await r.text()}async function info(id){const a=await api('/api/apps/'+id);const d=await api('/api/apps/'+id+'/deployments');alert(`Webhook: /api/deploy/webhooks/github/${id}\nSecret: ${a.webhookSecret||'admin only'}\nDeployments: ${d.length}`)}async function usersList(){const j=await api('/api/auth/users');alert(j.users.map(u=>`${u.username} · ${u.role} · ${u.disabled?'disabled':'enabled'}`).join('\n'))}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');boot()</script></body></html>
